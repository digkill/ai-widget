<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>AI Widget</title>
    <!-- Подключи твой виджет -->
    <script src="/dist/ai-widget.umd.js"></script>
</head>
<body>
<div id="app"></div>

<!-- Монтируй его -->
<script>
    window.addEventListener('load', () => {
        // const interval = setInterval(() => {
        if (window.AiWidget?.mount) {
            const el = document.createElement('div');
            document.body.appendChild(el);

            window.AiWidget.mount(el, {
                apiBase: 'http://localhost:8085'
            });

            console.log('🔥 Виджет загружен и смонтирован!');
            //clearInterval(interval);
        }
//   }, 50);
    });
</script>
</body>
</html>
